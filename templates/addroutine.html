{%extends 'base.html'%}

{% block main%}
<div class="section-heading">
    <div>
        <p class="eyebrow">Routines</p>
        <h1>Name your routine</h1>
    </div>
</div>

<div class="form-card">
    <form action="/submit-routine" method="get" class="form-shell">
        <div class="field">
            <label class="field-label" for="routine-name">Routine Name</label>
            <input type="text" id="routine-name" name="routine-name"
                pattern="[A-Za-z0-9 ]+" maxlength="24"
                autocomplete="off" spellcheck="false"
                placeholder="e.g. Push Day" required>
        </div>
        <div class="button-row">
            <button type="submit">Create Routine</button>
            <a class="button button-ghost" href="/plan">Cancel</a>
        </div>
    </form>
</div>

{%endblock%}
