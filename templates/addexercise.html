{% extends 'base.html'%}

{% block main %}
<div class="section-heading">
    <div>
        <p class="eyebrow">{{ routine_name }}</p>
        <h1>Add Exercise</h1>
    </div>
    <a class="button button-ghost" href="/plan">Done</a>
</div>

<div class="form-card">
    <form action="{{url_for('submit_exercise',routine=routine_name)}}" method="get" class="form-shell">
        <div class="field">
            <label class="field-label" for="exercise-name">Exercise Name</label>
            <input type="text" id="exercise-name" name="exercise-name"
                pattern="[A-Za-z0-9 ]+" autocomplete="off"
                placeholder="e.g. Bench Press" required>
        </div>
        <div class="field">
            <label class="field-label" for="sets">Number of Sets</label>
            <input type="number" id="sets" name="sets"
                min="1" max="20" autocomplete="off"
                placeholder="e.g. 3" required>
        </div>
        <div class="button-row">
            <button type="submit">Add Exercise</button>
        </div>
    </form>
</div>

{%endblock%}
