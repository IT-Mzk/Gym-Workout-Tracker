{% extends 'base.html' %}

{% block main %}
<div class="section-heading">
    <div>
        <p class="eyebrow">Profile</p>
        <h1>Change Profile Picture</h1>
    </div>
    <a class="button button-ghost" href="/profile">Back</a>
</div>

<div class="form-card">
    <form method="post" enctype="multipart/form-data"
          action="{{ url_for('photo_uploaded') }}" class="form-shell">
        <div class="field">
            <label class="field-label" for="file">Choose a photo</label>
            <input type="file" id="file" name="file" accept="image/*" required>
        </div>
        <div class="button-row">
            <button type="submit">Upload Photo</button>
        </div>
    </form>
</div>
{% endblock %}
